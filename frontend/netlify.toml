[[redirects]]
  from = "/api/*"
  to = "https://project-toko-online-vibe-coding-production.up.railway.app/api/:splat" # Your production backend API URL
  status = 200
  force = true # Optional: ensures the redirect happens even if a file exists at the path

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
